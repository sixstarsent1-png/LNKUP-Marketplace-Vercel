name: Phase 14 Quality Gate

on:
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  phase14-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Phase 14 blocking suites
        run: >
          npx playwright test
          tests/e2e/lnkup-app-phase14a-journey-handoffs.spec.ts
          tests/e2e/lnkup-app-phase14b-organizer-loop.spec.ts
          tests/e2e/lnkup-app-phase14c-wallet-polish.spec.ts
          tests/e2e/lnkup-app-phase14-analytics.spec.ts
          --project=lnkup-app

      - name: Run critical pre-merge smoke
        run: >
          npx playwright test
          tests/e2e/lnkup-app-phase14a-journey-handoffs.spec.ts
          --project=lnkup-app
